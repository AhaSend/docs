name: Documentation checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: false
      - name: Install check tools
        run: |
          python -m pip install -r scripts/requirements.txt
          npm install --global mint@4.2.315
          go install github.com/AhaSend/ahasend-cli@v0.2.0
      - name: Collect actual release command and flag names
        run: python scripts/capture_cli.py --binary "$(go env GOPATH)/bin/ahasend-cli" --output "$RUNNER_TEMP/ahasend-cli.json"
      - name: Check page metadata, headings, navigation, code and CLI names
        run: python scripts/docs_lint.py --cli-reference "$RUNNER_TEMP/ahasend-cli.json"
      - name: Validate docs.json against the public schema
        run: |
          curl --fail --location --user-agent 'Mozilla/5.0' https://mintlify.com/docs.json --output "$RUNNER_TEMP/mintlify-schema.json"
          python scripts/validate_schema.py --schema "$RUNNER_TEMP/mintlify-schema.json"
      - name: Validate Mintlify pages
        run: mint validate
      - name: Check links
        run: mint broken-links
      - name: Prove the checks reject broken copies
        run: python scripts/test_docs_checks.py --cli-reference "$RUNNER_TEMP/ahasend-cli.json" --mint mint
